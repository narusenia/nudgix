<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plain CSS example</title>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <header class="site-header">
      <span class="logo">Acme</span>
      <nav class="nav"><a href="#">Pricing</a><a href="#">Docs</a><a href="#">Blog</a></nav>
    </header>
    <main class="page">
      <section class="hero">
        <h1 class="hero__title">Ship UI tweaks faster</h1>
        <p class="hero__lead">Try spacing, color and type in the browser, then hand the list to your coding agent.</p>
        <button class="button button--primary">Get started</button>
      </section>
      <section class="cards">
        <article class="card">
          <h2 class="card__title">Starter</h2>
          <p class="card__body">For side projects.</p>
          <span class="badge">Free</span>
        </article>
        <article class="card">
          <h2 class="card__title">Team</h2>
          <p class="card__body">For small teams that ship every day.</p>
          <span class="badge badge--accent">Popular</span>
        </article>
        <article class="card">
          <h2 class="card__title">Enterprise</h2>
          <p class="card__body">SSO, audit logs and support.</p>
          <span class="badge">Contact us</span>
        </article>
      </section>
    </main>
  </body>
</html>
